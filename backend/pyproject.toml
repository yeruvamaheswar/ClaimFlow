[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "claimflow-backend"
version = "0.1.0"
description = "Synthetic-data-only ClaimFlow evidence and exception review API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.142,<0.145",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI declares dependencies as Depends() argument defaults.
ignore = ["B008"]
